name: Disposable backend API check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backend-api-check.yml'
      - '.github/kurumi-stress/api.py'
      - 'cmd/kurumi/**'
      - 'internal/**'
      - 'web/**'
      - 'third_party/frp/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a GitHub-hosted runner
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the runner-only workbench
        run: |
          mkdir -p "$RUNNER_TEMP/kurumi-api-check-bin"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/kurumi-api-check-bin/kurumi" ./cmd/kurumi
      - name: Exercise a disposable loopback instance
        run: |
          python3 .github/kurumi-stress/api.py "$RUNNER_TEMP/kurumi-api-check-bin/kurumi"

