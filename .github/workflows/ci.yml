name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kurumi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Format, vet and unit tests
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal web)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; gofmt -d cmd internal web; exit 1; fi
          go vet ./...
          go test -count=1 -v ./...
          go build -o kurumi ./cmd/kurumi
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Official core download, activation and real frp TCP roundtrip
        if: runner.os == 'Linux'
        run: python3 scripts/core-smoke.py ./kurumi
      - name: Windows package and installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KURUMI_PACKAGE_TARGET = 'windows_amd64'
          python scripts/package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/install-smoke.py dist/KurumiFRP_0.3.0_windows_amd64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real browser UI tests (catalog fixtures only)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-smoke.py ./kurumi
          python3 scripts/core-ui-smoke.py ./kurumi
  package:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Build all four packages and verify Linux installer
        run: |
          python3 scripts/package.py
          python3 scripts/install-smoke.py dist/KurumiFRP_0.3.0_linux_amd64.tar.gz
      - name: Publish versioned preview without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; kept unchanged. Bump VERSION for another release."
            exit 0
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KurumiFRP $version preview" --notes-file "docs/RELEASE_$version.md" --prerelease
