name: Build native packages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kurumi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.labels.outputs.allowed }}
    permissions:
      issues: read
    steps:
      # Inspect GitHub metadata only; do not check out or run PR code here.
      - name: Check Launch label
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_KIND: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_KIND" != pull_request ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo 'allowed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'allowed=false' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          case "$PR_NUMBER" in ''|*[!0-9]*) echo 'allowed=false' >> "$GITHUB_OUTPUT"; exit 0;; esac
          if ! labeled="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" --jq 'any(.labels[]; (.name | ascii_downcase) == "launch")')"; then
            echo '::warning::Could not check the Launch label; build skipped.'
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$labeled" = true ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Launch label missing; build skipped.'
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi
  resolve-frp:
    needs: [launch-gate]
    if: needs.launch-gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.latest.outputs.release }}
    steps:
      # Metadata only. The tag and all package checksums are shared by every architecture.
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/fatedier/frp/releases/latest > "$RUNNER_TEMP/frp-release.json"
          jq -e '.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"))' "$RUNNER_TEMP/frp-release.json" >/dev/null
          release="$(jq -c '{tag_name,draft,prerelease,assets:[.assets[]|{name,size,digest,browser_download_url}]}' "$RUNNER_TEMP/frp-release.json")"
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
  package:
    needs: [launch-gate, resolve-frp]
    if: needs.launch-gate.outputs.allowed == 'true'
    env:
      KURUMI_FRP_RELEASE: ${{ needs.resolve-frp.outputs.release }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            cmd
            docs
            internal
            packaging
            scripts
            web
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Build universal Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-native.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Linux packages and portable archives
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python3 scripts/package-native.py linux
          python3 scripts/package-portable.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ runner.os }}
          path: |
            dist-native/*.exe
            dist-native/*.deb
            dist-native/*.rpm
            dist-native/*.tar.gz
          if-no-files-found: error
  source-macos:
    needs: [launch-gate]
    if: needs.launch-gate.outputs.allowed == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            cmd
            docs
            internal
            packaging
            scripts
            web
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Build macOS source
        run: go build -o kurumi ./cmd/kurumi
  release:
    needs: [package, source-macos]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            cmd
            docs
            internal
            packaging
            scripts
            web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist-native
          merge-multiple: true
      - name: Verify package set and publish without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]]
          IFS=. read -r a b c d <<< "$version"
          for part in "$a" "$b" "$c" "$d"; do (( 10#$part <= 65535 )); done
          test -s "dist-native/KurumiFRP-${version}-Setup.exe"
          for arch in amd64 arm64 armhf riscv64; do
            test -s "dist-native/kurumifrp_${version}_${arch}.deb"
          done
          for arch in x86_64 aarch64; do
            test -s "dist-native/kurumifrp-${version}-1.${arch}.rpm"
          done
          for arch in arm arm_hf riscv64 loong64 mips mipsle mips64 mips64le; do
            test -s "dist-native/KurumiFRP-${version}-linux-${arch}.tar.gz"
          done
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release retained; bump VERSION for another release.'
            exit 0
          fi
          gh release create "v$version" dist-native/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KurumiFrp $version" --notes-file "docs/RELEASE_$version.md" --prerelease
