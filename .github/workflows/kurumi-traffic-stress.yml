name: Temporary loopback traffic stress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kurumi-traffic-stress.yml'
      - '.github/kurumi-stress/traffic.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/frp/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kurumi-traffic-stress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loopback-traffic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Build with Go race detection and stress local tunnels
        shell: bash
        run: |
          go build -race -o "$RUNNER_TEMP/kurumi-stress" ./cmd/kurumi
          KURUMI_BINARY="$RUNNER_TEMP/kurumi-stress" python3 .github/kurumi-stress/traffic.py

